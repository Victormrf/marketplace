        "tags": ["Deliveries"], "operationId": "transitionDelivery", "summary": "Solicita transição da máquina de delivery", "description": "Seller proprietário ou ADMIN; customer somente leitura. Fluxo: SEPARATED → PROCESSING → SHIPPED → COLLECTED → ARRIVED_AT_CENTER → DELIVERED; estados operacionais também podem ir a FAILED; FAILED ou DELIVERED podem ir a RETURNED. Repetir estado atual é idempotente. reason opcional, trim, máximo 255 caracteres. deliveredAt é definido pelo backend.", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "parameters": [{ "$ref": "#/components/parameters/DeliveryId" }], "requestBody": { "$ref": "#/components/requestBodies/DeliveryStatusInput" },
        "responses": { "200": { "description": "Delivery após transição", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Delivery" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/deliveries/{deliveryId}/tracking": {
      "patch": {
        "tags": ["Deliveries"], "operationId": "updateDeliveryTracking", "summary": "Atualiza código, transportadora ou previsão", "description": "Seller proprietário ou ADMIN. Atualização parcial por whitelist; null pode limpar campos nullable. Tracking não altera histórico de status e é bloqueado em estados finais ou FAILED.", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "parameters": [{ "$ref": "#/components/parameters/DeliveryId" }], "requestBody": { "$ref": "#/components/requestBodies/DeliveryTrackingInput" },
        "responses": { "200": { "description": "Delivery atualizada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Delivery" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/products/{productId}/reviews": {
      "get": {
        "tags": ["Reviews"], "operationId": "listProductReviews", "summary": "Lista reviews públicas de produto e reputação", "parameters": [{ "$ref": "#/components/parameters/ProductId" }, { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/Limit" }, { "$ref": "#/components/parameters/Rating" }],
        "responses": { "200": { "description": "Coleção vazia retorna 200; inclui reputation", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ReviewCollection" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "404": { "$ref": "#/components/responses/NotFound" }, "500": { "$ref": "#/components/responses/InternalError" } }
      },
      "post": {
        "tags": ["Reviews"], "operationId": "createProductReview", "summary": "Customer avalia produto comprado em SellerOrder entregue", "description": "Somente CUSTOMER. productId vem da rota. Body aceita apenas rating inteiro 1–5 e comment opcional/null até 2000 chars. Unicidade customer/produto; duplicata 409. Product ativo não é requisito; compra entregue é.", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "parameters": [{ "$ref": "#/components/parameters/ProductId" }], "requestBody": { "$ref": "#/components/requestBodies/ReviewCreateInput" },
        "responses": { "201": { "description": "Review criada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Review" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/sellers/{sellerId}/reviews": {
      "get": {
        "tags": ["Reviews"], "operationId": "listSellerReviews", "summary": "Lista reviews públicas direcionadas diretamente ao seller", "description": "Reviews de produtos do seller não entram na reputação direta.", "parameters": [{ "$ref": "#/components/parameters/SellerIdPath" }, { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/Limit" }, { "$ref": "#/components/parameters/Rating" }],
        "responses": { "200": { "description": "Coleção e reputation", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ReviewCollection" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "404": { "$ref": "#/components/responses/NotFound" }, "500": { "$ref": "#/components/responses/InternalError" } }
      },
      "post": {
        "tags": ["Reviews"], "operationId": "createSellerReview", "summary": "Customer avalia seller com SellerOrder entregue", "description": "Somente CUSTOMER. sellerId vem da rota; body aceita apenas rating e comment. Unicidade customer/seller; duplicata 409.", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "parameters": [{ "$ref": "#/components/parameters/SellerIdPath" }], "requestBody": { "$ref": "#/components/requestBodies/ReviewCreateInput" },
        "responses": { "201": { "description": "Review criada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Review" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/reviews/{reviewId}": {
      "get": {
        "tags": ["Reviews"], "operationId": "getReview", "summary": "Consulta review individual pública", "parameters": [{ "$ref": "#/components/parameters/ReviewId" }],
        "responses": { "200": { "description": "Review", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Review" } } } }, "404": { "$ref": "#/components/responses/NotFound" }, "500": { "$ref": "#/components/responses/InternalError" } }
      },
      "patch": {
        "tags": ["Reviews"], "operationId": "updateOwnReview", "summary": "Autor atualiza rating e/ou comment da própria review", "description": "Autenticação obrigatória; somente o autor. Campos de alvo/autor não são aceitos. Campos omitidos são preservados; comment null ou vazio limpa o comentário. Não existe DELETE.", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "parameters": [{ "$ref": "#/components/parameters/ReviewId" }], "requestBody": { "$ref": "#/components/requestBodies/ReviewUpdateInput" },
        "responses": { "200": { "description": "Review atualizada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Review" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/dashboard/seller/summary": {
      "get": {
        "tags": ["Seller dashboard"], "operationId": "getSellerDashboardSummary", "summary": "Resumo de receita bruta, pedidos entregues e unidades", "description": "Somente SELLER; sellerId derivado da sessão. Receita usa SellerOrder DELIVERED e completedAt, totalInCents; não desconta refunds. Range padrão últimos 30 dias; from/to inclusivos YYYY-MM-DD, intervalo máximo 366 dias.", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "parameters": [{ "$ref": "#/components/parameters/DashboardFrom" }, { "$ref": "#/components/parameters/DashboardTo" }],
        "responses": { "200": { "description": "Valores financeiros em centavos", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DashboardSummary" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/dashboard/seller/orders": {
      "get": {
        "tags": ["Seller dashboard"], "operationId": "listSellerDashboardOrders", "summary": "Lista SellerOrders criadas no período", "description": "Filtro temporal usa createdAt, distinto das métricas de receita. Defaults page=1, limit=20, máximo 100.", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "parameters": [{ "$ref": "#/components/parameters/DashboardFrom" }, { "$ref": "#/components/parameters/DashboardTo" }, { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/Limit" }, { "name": "status", "in": "query", "schema": { "$ref": "#/components/schemas/SellerOrderStatus" } }],
        "responses": { "200": { "description": "Pedidos do seller e paginação", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DashboardOrderCollection" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/dashboard/seller/orders/by-status": {
      "get": {
        "tags": ["Seller dashboard"], "operationId": "countSellerDashboardOrdersByStatus", "summary": "Contagem por todos os status de SellerOrder", "parameters": [{ "$ref": "#/components/parameters/DashboardFrom" }, { "$ref": "#/components/parameters/DashboardTo" }],
        "responses": { "200": { "description": "Inclui status com contagem zero", "content": { "application/json": { "schema": { "type": "array", "items": { "$ref": "#/components/schemas/DashboardStatusCount" } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/dashboard/seller/sales/timeseries": {
      "get": {
        "tags": ["Seller dashboard"], "operationId": "getSellerSalesTimeseries", "summary": "Série temporal de receita reconhecida", "description": "Usa completedAt e SellerOrder DELIVERED; períodos ausentes são preenchidos com zero, em ordem crescente.", "parameters": [{ "$ref": "#/components/parameters/DashboardFrom" }, { "$ref": "#/components/parameters/DashboardTo" }, { "name": "interval", "in": "query", "schema": { "type": "string", "enum": ["day", "month"], "default": "day" } }], "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "responses": { "200": { "description": "Pontos diários YYYY-MM-DD ou mensais YYYY-MM", "content": { "application/json": { "schema": { "type": "array", "items": { "$ref": "#/components/schemas/DashboardTimeseriesPoint" } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/dashboard/seller/sales/by-category": {
      "get": {
        "tags": ["Seller dashboard"], "operationId": "getSellerSalesByCategory", "summary": "Agrega receita e unidades por categoria atual do produto", "description": "Somente DELIVERED no período de completedAt; categoria é cadastro atual porque OrderItem não possui snapshot da categoria.", "parameters": [{ "$ref": "#/components/parameters/DashboardFrom" }, { "$ref": "#/components/parameters/DashboardTo" }], "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "responses": { "200": { "description": "Agregações em centavos", "content": { "application/json": { "schema": { "type": "array", "items": { "$ref": "#/components/schemas/DashboardCategory" } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/dashboard/seller/products/top": {
      "get": {
        "tags": ["Seller dashboard"], "operationId": "getSellerTopProducts", "summary": "Produtos mais vendidos por unidades entregues", "description": "Nome vem do snapshot mais recente de OrderItem; limit default 5, máximo 50. Receita baseada em linhas de SellerOrders DELIVERED dentro do período.", "parameters": [{ "$ref": "#/components/parameters/DashboardFrom" }, { "$ref": "#/components/parameters/DashboardTo" }, { "name": "limit", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 50, "default": 5 } }], "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "responses": { "200": { "description": "Top produtos sem lookup por item", "content": { "application/json": { "schema": { "type": "array", "items": { "$ref": "#/components/schemas/DashboardTopProduct" } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/dashboard/seller/customers/new": {
      "get": {
        "tags": ["Seller dashboard"], "operationId": "getSellerNewCustomers", "summary": "Conta customers na primeira compra com este seller", "description": "Considera o histórico completo de SellerOrders do par customer/seller, e não a primeira Order global do customer.", "parameters": [{ "$ref": "#/components/parameters/DashboardFrom" }, { "$ref": "#/components/parameters/DashboardTo" }], "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "responses": { "200": { "description": "Contagem agregada por mês", "content": { "application/json": { "schema": { "type": "array", "items": { "$ref": "#/components/schemas/DashboardNewCustomers" } } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/dashboard/seller/ratings": {
      "get": {
        "tags": ["Seller dashboard"], "operationId": "getSellerRatings", "summary": "Reputação direta do seller", "description": "Inclui apenas reviews cujo alvo é o seller; reviews de produtos não são agregadas.", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "responses": { "200": { "description": "Média, total e distribuição de ratings", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Reputation" } } } }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "cookieAuth": { "type": "apiKey", "in": "cookie", "name": "token", "description": "Cookie JWT token HttpOnly emitido por POST /users/login." },
      "bearerAuth": { "type": "http", "scheme": "bearer", "bearerFormat": "JWT", "description": "Alternativa aceita pelo authMiddleware; não use token enviado no body." }
    },
    "parameters": {
      "Page": { "name": "page", "in": "query", "schema": { "type": "integer", "minimum": 1, "default": 1 } },
      "Limit": { "name": "limit", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 100, "default": 20 } },
      "Search": { "name": "search", "in": "query", "schema": { "type": "string", "minLength": 1 } },
      "Category": { "name": "category", "in": "query", "schema": { "$ref": "#/components/schemas/ProductCategory" } },
      "SellerIdQuery": { "name": "sellerId", "in": "query", "schema": { "type": "string", "format": "uuid" } },
      "InStock": { "name": "inStock", "in": "query", "description": "Boolean textual true ou false", "schema": { "type": "boolean" } },
      "Rating": { "name": "rating", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 5 } },
      "CreatedFrom": { "name": "createdFrom", "in": "query", "description": "String de data/hora parseável; limite inferior inclusivo", "schema": { "type": "string", "format": "date-time" } },
      "CreatedTo": { "name": "createdTo", "in": "query", "description": "String de data/hora parseável; limite superior inclusivo", "schema": { "type": "string", "format": "date-time" } },
      "DashboardFrom": { "name": "from", "in": "query", "description": "Início inclusivo, YYYY-MM-DD. Default: 30 dias antes do dia de to.", "schema": { "type": "string", "format": "date" } },
      "DashboardTo": { "name": "to", "in": "query", "description": "Dia final inclusivo, YYYY-MM-DD. Default: hoje.", "schema": { "type": "string", "format": "date" } },
      "UserId": { "name": "userId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
      "AddressId": { "name": "addressId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
      "ProductId": { "name": "productId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
      "SellerIdPath": { "name": "sellerId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
      "OrderId": { "name": "orderId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
      "SellerOrderId": { "name": "sellerOrderId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
      "PaymentAttemptId": { "name": "paymentAttemptId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
      "RefundId": { "name": "refundId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
      "DeliveryId": { "name": "deliveryId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } },
      "ReviewId": { "name": "reviewId", "in": "path", "required": true, "schema": { "type": "string", "format": "uuid" } }
    },
    "requestBodies": {
      "LoginInput": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["email", "password"], "additionalProperties": false, "properties": { "email": { "type": "string", "format": "email" }, "password": { "type": "string", "minLength": 1 } } }, "example": { "email": "customer@example.invalid", "password": "example-only" } } } },
      "UserRegistrationInput": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/UserRegistrationInput" }, "example": { "name": "Example Customer", "email": "customer@example.invalid", "password": "example-only", "role": "CUSTOMER" } } } },
      "UserUpdateInput": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/UserUpdateInput" } } } },
      "CustomerProfileInput": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CustomerProfileInput" }, "example": { "phone": "+55 11 5555-0100" } } } },
      "SellerProfileCreateInput": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/SellerProfileCreateInput"
            },
            "example": {
              "storeName": "Example Store",
              "description": "Development example",
              "logo": null
            }
          },
          "multipart/form-data": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "storeName"
              ],
              "properties": {
                "storeName": {
                  "type": "string"
                },
                "description": {
                  "type": "string"
                },
                "logo": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          }
        }
      },
      "SellerProfileUpdateInput": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/SellerProfileUpdateInput"
            },
            "example": {
              "description": "Updated description"
            }
          },
          "multipart/form-data": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "storeName": {
                  "type": "string"
                },
                "description": {
                  "type": "string"
                },
                "logo": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          }
        }
      },
      "CustomerAddressCreateInput": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CustomerAddressCreateInput" }, "example": { "recipientName": "Example Person", "postalCode": "01001000", "street": "Rua Exemplo", "number": "100", "complement": null, "neighborhood": "Centro", "city": "São Paulo", "state": "SP", "countryCode": "BR", "phone": null, "isDefault": true } } } },
      "CustomerAddressUpdateInput": { "required": true, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CustomerAddressUpdateInput" } } } },
      "ProductCreateInput": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ProductCreateInput"
            }
          },
          "multipart/form-data": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "name",
                "priceInCents",
                "category"
              ],
              "properties": {
                "name": {
                  "type": "string"
                },
                "reference": {
                  "type": "string"
                },
                "description": {
                  "type": "string"
                },
                "priceInCents": {
                  "type": "integer",
                  "minimum": 0
                },
                "currency": {
                  "$ref": "#/components/schemas/Currency"
                },
                "category": {
                  "$ref": "#/components/schemas/ProductCategory"
                },
                "image": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          }
        }
      },
      "ProductUpdateInput": {
        "required": true,
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ProductUpdateInput"
            }
          },
          "multipart/form-data": {
            "schema": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "name": {
                  "type": "string"
                },
                "reference": {
                  "type": "string"
                },
                "description": {
                  "type": "string"
                },
                "priceInCents": {
                  "type": "integer",
                  "minimum": 0
                },
                "currency": {
                  "$ref": "#/components/schemas/Currency"
                },
                "category": {
                  "$ref": "#/components/schemas/ProductCategory"
                },
                "image": {
                  "type": "string",
                  "format": "binary"
                }
              },
              "minProperties": 1
            }
          }
        }
      },
      "RestockInput": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["quantity"], "properties": { "quantity": { "type": "integer", "minimum": 1 }, "reason": { "type": "string", "nullable": true } } }, "example": { "quantity": 5, "reason": "Reposição de exemplo" } } } },
      "InventoryAdjustmentInput": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["onHandDelta", "reason"], "properties": { "onHandDelta": { "type": "integer", "not": { "enum": [0] } }, "reason": { "type": "string", "minLength": 1 } } } } } },
      "CartItemInput": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["productId", "quantity"], "additionalProperties": false, "properties": { "productId": { "type": "string", "format": "uuid" }, "quantity": { "type": "integer", "minimum": 1 } } } } } },
      "CartQuantityInput": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["quantity"], "additionalProperties": false, "properties": { "quantity": { "type": "integer", "minimum": 1 } } } } } },
      "CheckoutInput": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["addressId"], "additionalProperties": false, "properties": { "addressId": { "type": "string", "format": "uuid" } } }, "example": { "addressId": "00000000-0000-0000-0000-000000000111" } } } },
      "SellerOrderTransitionInput": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["status"], "additionalProperties": false, "properties": { "status": { "$ref": "#/components/schemas/SellerOrderStatus" }, "reason": { "type": "string", "maxLength": 500 } } } } } },
      "PaymentAttemptInput": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["method"], "additionalProperties": false, "properties": { "method": { "$ref": "#/components/schemas/PaymentMethod" } } }, "example": { "method": "PIX" } } } },
      "RefundInput": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["amountInCents"], "additionalProperties": false, "properties": { "amountInCents": { "type": "integer", "minimum": 1 }, "reason": { "type": "string", "nullable": true, "maxLength": 500 } } }, "example": { "amountInCents": 2500, "reason": "Solicitação de exemplo" } } } },
      "DeliveryCreateInput": { "required": false, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeliveryCreateInput" } } } },
      "DeliveryStatusInput": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["status"], "additionalProperties": false, "properties": { "status": { "$ref": "#/components/schemas/DeliveryStatus" }, "reason": { "type": "string", "nullable": true, "maxLength": 255 } } } } } },
      "DeliveryTrackingInput": { "required": true, "content": { "application/json": { "schema": { "type": "object", "minProperties": 1, "additionalProperties": false, "properties": { "trackingCode": { "type": "string", "maxLength": 255 }, "carrier": { "type": "string", "maxLength": 255 }, "estimatedDelivery": { "type": "string", "format": "date-time", "nullable": true } } } } } },
      "ReviewCreateInput": { "required": true, "content": { "application/json": { "schema": { "type": "object", "required": ["rating"], "additionalProperties": false, "properties": { "rating": { "type": "integer", "minimum": 1, "maximum": 5 }, "comment": { "type": "string", "nullable": true, "maxLength": 2000 } } } } } },
      "ReviewUpdateInput": { "required": true, "content": { "application/json": { "schema": { "type": "object", "minProperties": 1, "additionalProperties": false, "properties": { "rating": { "type": "integer", "minimum": 1, "maximum": 5 }, "comment": { "type": "string", "nullable": true, "maxLength": 2000 } } } } } }
    },
    "responses": {
