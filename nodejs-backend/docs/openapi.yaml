{
  "openapi": "3.0.3",
  "info": {
    "title": "Marketplace API — schema-v2",
    "version": "2.0.0",
    "description": "Contrato HTTP do backend Express. Este documento usa a sintaxe JSON, que é um subconjunto válido de YAML 1.2, para permitir validação sem dependência de parser externo. Datas são strings ISO 8601 no JSON. Valores monetários são inteiros em centavos; currency acompanha os valores quando aplicável."
  },
  "servers": [
    {
      "url": "http://localhost:8000",
      "description": "Somente desenvolvimento local; não é uma URL de produção"
    }
  ],
  "tags": [
    { "name": "System" },
    { "name": "Authentication" },
    { "name": "Users" },
    { "name": "Customer profiles" },
    { "name": "Seller profiles" },
    { "name": "Customer addresses" },
    { "name": "Catalog" },
    { "name": "Inventory" },
    { "name": "Cart" },
    { "name": "Checkout" },
    { "name": "Orders" },
    { "name": "Seller orders" },
    { "name": "Payments" },
    { "name": "Refunds" },
    { "name": "Deliveries" },
    { "name": "Reviews" },
    { "name": "Seller dashboard" }
  ],
  "paths": {
    "/": {
      "get": {
        "tags": ["System"],
        "operationId": "getRoot",
        "summary": "Confirma que o processo HTTP respondeu",
        "responses": {
          "200": {
            "description": "Texto simples de inicialização do servidor",
            "content": { "text/html": { "schema": { "type": "string" }, "example": "Server running on port 8000" } }
          }
        }
      }
    },
    "/users/login": {
      "post": {
        "tags": ["Authentication"],
        "operationId": "login",
        "summary": "Autentica e define o cookie de sessão",
        "description": "O JWT não é retornado no corpo. A resposta define o cookie token HttpOnly, com validade de 24 horas no cookie (o JWT expira em 1 hora). No navegador, o frontend usa sua ponte Next /api para transferir a sessão ao domínio do frontend; essa ponte não faz parte deste contrato.",
        "requestBody": { "$ref": "#/components/requestBodies/LoginInput" },
        "responses": {
          "200": { "description": "Autenticado; cookie token emitido", "headers": { "Set-Cookie": { "schema": { "type": "string" }, "description": "Cookie token HttpOnly; valor fictício omitido" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Message" }, "example": { "message": "User logged in successfully." } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/users/logout": {
      "post": {
        "tags": ["Authentication"],
        "operationId": "logout",
        "summary": "Limpa o cookie de sessão",
        "description": "Não exige autenticação válida; a resposta limpa token no cliente HTTP.",
        "responses": {
          "200": { "description": "Cookie limpo", "headers": { "Set-Cookie": { "schema": { "type": "string" }, "description": "Cookie token expirado" } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Message" } } } }
        }
      }
    },
    "/users/register": {
      "post": {
        "tags": ["Users"],
        "operationId": "registerUser",
        "summary": "Cria uma conta CUSTOMER ou SELLER",
        "description": "ADMIN não pode ser criado pelo registro público. Password é aceito somente na entrada e nunca faz parte do DTO de resposta.",
        "requestBody": { "$ref": "#/components/requestBodies/UserRegistrationInput" },
        "responses": {
          "201": { "description": "Conta criada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/User" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/users/me": {
      "get": {
        "tags": ["Users"],
        "operationId": "getCurrentUser",
        "summary": "Lê a identidade autenticada",
        "description": "A identidade é extraída da sessão; não aceite userId para selecionar outro usuário.",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "responses": {
          "200": { "description": "Usuário atual", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/User" } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/users/": {
      "put": {
        "tags": ["Users"],
        "operationId": "updateCurrentUser",
        "summary": "Atualiza a própria conta",
        "description": "Aceita somente name, email e password; body vazio e campos protegidos são rejeitados. Email duplicado retorna conflito.",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "requestBody": { "$ref": "#/components/requestBodies/UserUpdateInput" },
        "responses": {
          "200": { "description": "Conta atualizada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/User" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/users/{userId}": {
      "delete": {
        "tags": ["Users"],
        "operationId": "deactivateUser",
        "summary": "Desativa logicamente um usuário",
        "description": "Somente ADMIN. A operação não remove o registro fisicamente.",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "parameters": [{ "$ref": "#/components/parameters/UserId" }],
        "responses": {
          "204": { "$ref": "#/components/responses/NoContent" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/customers": {
      "post": {
        "tags": ["Customer profiles"],
        "operationId": "createCustomerProfile",
        "summary": "Cria o perfil da conta CUSTOMER atual",
        "description": "Somente role CUSTOMER. A propriedade permitida é phone; userId vem da autenticação. Apenas um perfil de customer/seller pode existir por usuário.",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "requestBody": { "$ref": "#/components/requestBodies/CustomerProfileInput" },
        "responses": {
          "201": { "description": "Perfil criado", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CustomerProfile" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      },
      "get": {
        "tags": ["Customer profiles"],
        "operationId": "getCurrentCustomerProfile",
        "summary": "Lê o perfil CUSTOMER atual",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "responses": {
          "200": { "description": "Perfil próprio no envelope profile", "content": { "application/json": { "schema": { "type": "object", "required": ["profile"], "properties": { "profile": { "$ref": "#/components/schemas/CustomerProfile" } } } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      },
      "put": {
        "tags": ["Customer profiles"],
        "operationId": "updateCurrentCustomerProfile",
        "summary": "Atualiza o perfil CUSTOMER atual",
        "description": "Aceita somente phone; null ou string vazia limpam o telefone.",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "requestBody": { "$ref": "#/components/requestBodies/CustomerProfileInput" },
        "responses": {
          "200": { "description": "Perfil atualizado", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CustomerProfile" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/customers/all": {
      "get": {
        "tags": ["Customer profiles"],
        "operationId": "listAllCustomerProfiles",
        "summary": "Lista perfis CUSTOMER para administração",
        "description": "Somente ADMIN. Retorna { profiles: [...] } sem paginação.",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "responses": {
          "200": { "description": "Perfis e DTOs públicos dos usuários", "content": { "application/json": { "schema": { "type": "object", "required": ["profiles"], "properties": { "profiles": { "type": "array", "items": { "$ref": "#/components/schemas/CustomerProfileWithUser" } } } } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/sellers": {
      "post": {
        "tags": ["Seller profiles"],
        "operationId": "createSellerProfile",
        "summary": "Cria o perfil SELLER da conta atual",
        "description": "Somente role SELLER. userId é derivado da autenticação. Campos aceitos: storeName obrigatório, description e logo opcionais. Logo pode ser enviada como arquivo multipart ou string conforme o middleware/serviço.",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "requestBody": { "$ref": "#/components/requestBodies/SellerProfileCreateInput" },
        "responses": {
          "201": { "description": "Perfil criado", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SellerProfile" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      },
      "get": {
        "tags": ["Seller profiles"],
        "operationId": "getCurrentSellerProfile",
        "summary": "Lê o perfil SELLER atual",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "responses": {
          "200": { "description": "Perfil próprio no envelope profile", "content": { "application/json": { "schema": { "type": "object", "required": ["profile"], "properties": { "profile": { "$ref": "#/components/schemas/SellerProfile" } } } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      },
      "put": {
        "tags": ["Seller profiles"],
        "operationId": "updateCurrentSellerProfile",
        "summary": "Atualiza o perfil SELLER atual",
        "description": "Aceita storeName, description e logo; userId é determinado pelo backend.",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "requestBody": { "$ref": "#/components/requestBodies/SellerProfileUpdateInput" },
        "responses": {
          "200": { "description": "Perfil atualizado", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SellerProfile" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/sellers/all": {
      "get": {
        "tags": ["Seller profiles"],
        "operationId": "listAllSellerProfiles",
        "summary": "Lista perfis SELLER para administração",
        "description": "Somente ADMIN. Retorna { profiles: [...] } sem paginação.",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "responses": {
          "200": { "description": "Perfis e DTOs públicos dos usuários", "content": { "application/json": { "schema": { "type": "object", "required": ["profiles"], "properties": { "profiles": { "type": "array", "items": { "$ref": "#/components/schemas/SellerProfileWithUser" } } } } } } },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/sellers/{userId}": {
      "delete": {
        "tags": ["Seller profiles"],
        "operationId": "deactivateSellerProfile",
        "summary": "Desativa logicamente perfil de seller",
        "description": "O próprio seller ou ADMIN. Apesar de o service produzir um DTO, o controller responde sem corpo (204).",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "parameters": [{ "$ref": "#/components/parameters/UserId" }],
        "responses": {
          "204": { "$ref": "#/components/responses/NoContent" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/customers/addresses": {
      "get": {
        "tags": ["Customer addresses"],
        "operationId": "listCustomerAddresses",
        "summary": "Lista endereços ativos do customer autenticado",
        "description": "Somente CUSTOMER; ownership vem de req.user. Paginação padrão page=1, limit=20, máximo 100.",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }],
        "parameters": [{ "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/Limit" }],
        "responses": {
          "200": { "description": "Coleção paginada", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CustomerAddressCollection" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "500": { "$ref": "#/components/responses/InternalError" }
        }
      },
      "post": {
        "tags": ["Customer addresses"], "operationId": "createCustomerAddress", "summary": "Cria endereço para o customer autenticado", "description": "Campos obrigatórios: recipientName, postalCode, street, number, neighborhood, city e state. countryCode ausente assume BR; somente BR é suportado. isDefault é opcional.",
        "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "requestBody": { "$ref": "#/components/requestBodies/CustomerAddressCreateInput" },
        "responses": { "201": { "description": "Endereço criado", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CustomerAddress" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "409": { "$ref": "#/components/responses/Conflict" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/customers/addresses/{addressId}": {
      "get": {
        "tags": ["Customer addresses"], "operationId": "getCustomerAddress", "summary": "Consulta endereço ativo próprio", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "parameters": [{ "$ref": "#/components/parameters/AddressId" }],
        "responses": { "200": { "description": "Endereço", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CustomerAddress" } } } }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "500": { "$ref": "#/components/responses/InternalError" } }
      },
      "put": {
        "tags": ["Customer addresses"], "operationId": "updateCustomerAddress", "summary": "Atualiza endereço próprio", "description": "Whitelist de campos sem isDefault; envie ao menos um campo. Campos opcionais podem ser null para limpar.", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "parameters": [{ "$ref": "#/components/parameters/AddressId" }], "requestBody": { "$ref": "#/components/requestBodies/CustomerAddressUpdateInput" },
        "responses": { "200": { "description": "Endereço atualizado", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CustomerAddress" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "500": { "$ref": "#/components/responses/InternalError" } }
      },
      "delete": {
        "tags": ["Customer addresses"], "operationId": "deactivateCustomerAddress", "summary": "Desativa endereço próprio", "description": "Desativação lógica; não remove fisicamente.", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "parameters": [{ "$ref": "#/components/parameters/AddressId" }],
        "responses": { "204": { "$ref": "#/components/responses/NoContent" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/customers/addresses/{addressId}/default": {
      "put": {
        "tags": ["Customer addresses"], "operationId": "setDefaultCustomerAddress", "summary": "Define endereço próprio como default", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "parameters": [{ "$ref": "#/components/parameters/AddressId" }],
        "responses": { "200": { "description": "Endereço default", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/CustomerAddress" } } } }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/products": {
      "get": {
        "tags": ["Catalog"], "operationId": "listProducts", "summary": "Lista produtos ativos com filtros aplicados antes da paginação", "parameters": [{ "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/Limit" }, { "$ref": "#/components/parameters/Search" }, { "$ref": "#/components/parameters/Category" }, { "$ref": "#/components/parameters/SellerIdQuery" }, { "$ref": "#/components/parameters/InStock" }],
        "responses": { "200": { "description": "Produtos e paginação", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ProductCollection" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "500": { "$ref": "#/components/responses/InternalError" } }
      },
      "post": {
        "tags": ["Catalog"], "operationId": "createProduct", "summary": "Seller cria produto e Inventory inicial", "description": "Somente SELLER ativo. sellerId é sempre derivado da sessão. Envie imagem como arquivo image multipart ou como URL/texto image no JSON. Estoque não é criado por esse payload.", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "requestBody": { "$ref": "#/components/requestBodies/ProductCreateInput" },
        "responses": { "201": { "description": "Produto criado", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Product" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "409": { "$ref": "#/components/responses/Conflict" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/products/search": {
      "get": {
        "tags": ["Catalog"], "operationId": "searchProducts", "summary": "Busca produtos pelo termo q", "parameters": [{ "name": "q", "in": "query", "required": true, "schema": { "type": "string", "minLength": 1 } }, { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/Limit" }, { "$ref": "#/components/parameters/Category" }, { "$ref": "#/components/parameters/SellerIdQuery" }, { "$ref": "#/components/parameters/InStock" }],
        "responses": { "200": { "description": "Produtos e paginação", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ProductCollection" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/products/seller/{sellerId}": {
      "get": {
        "tags": ["Catalog"], "operationId": "listProductsBySeller", "summary": "Lista produtos públicos de um seller", "parameters": [{ "$ref": "#/components/parameters/SellerIdPath" }, { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/Limit" }, { "$ref": "#/components/parameters/Search" }, { "$ref": "#/components/parameters/Category" }, { "$ref": "#/components/parameters/InStock" }],
        "responses": { "200": { "description": "Produtos e paginação", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ProductCollection" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/products/category/{category}": {
      "get": {
        "tags": ["Catalog"], "operationId": "listProductsByCategory", "summary": "Lista produtos por ProductCategory do schema", "parameters": [{ "name": "category", "in": "path", "required": true, "schema": { "$ref": "#/components/schemas/ProductCategory" } }, { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/Limit" }, { "$ref": "#/components/parameters/Search" }, { "$ref": "#/components/parameters/SellerIdQuery" }, { "$ref": "#/components/parameters/InStock" }],
        "responses": { "200": { "description": "Produtos e paginação", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ProductCollection" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "500": { "$ref": "#/components/responses/InternalError" } }
      }
    },
    "/products/{productIds}": {
      "get": {
        "tags": ["Catalog"], "operationId": "getProductOrProductsByIds", "summary": "Consulta um produto ou uma coleção por IDs separados por vírgula", "description": "Um ID retorna Product; múltiplos IDs retornam ProductCollection paginada.", "parameters": [{ "name": "productIds", "in": "path", "required": true, "description": "UUID de produto ou lista de UUIDs separada por vírgula", "schema": { "type": "string" } }, { "$ref": "#/components/parameters/Page" }, { "$ref": "#/components/parameters/Limit" }],
        "responses": { "200": { "description": "Produto individual ou coleção, conforme quantidade de IDs", "content": { "application/json": { "schema": { "oneOf": [{ "$ref": "#/components/schemas/Product" }, { "$ref": "#/components/schemas/ProductCollection" }] } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "404": { "$ref": "#/components/responses/NotFound" }, "500": { "$ref": "#/components/responses/InternalError" } }
      },
      "put": {
        "tags": ["Catalog"], "operationId": "updateProduct", "summary": "Atualiza produto pertencente ao seller autenticado", "description": "Somente seller proprietário. Aceita JSON ou multipart/form-data, whitelist de campos de catálogo e imagem; estoque não é alterado aqui.", "security": [{ "cookieAuth": [] }, { "bearerAuth": [] }], "parameters": [{ "name": "productIds", "in": "path", "required": true, "description": "Use o ID único do produto", "schema": { "type": "string", "format": "uuid" } }], "requestBody": { "$ref": "#/components/requestBodies/ProductUpdateInput" },
        "responses": { "200": { "description": "Produto atualizado", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Product" } } } }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "403": { "$ref": "#/components/responses/Forbidden" }, "404": { "$ref": "#/components/responses/NotFound" }, "409": { "$ref": "#/components/responses/Conflict" }, "500": { "$ref": "#/components/responses/InternalError" } }
      },
      "delete": {
