      "CustomerProfile": { "type": "object", "required": ["id", "userId", "phone"], "properties": { "id": { "type": "string", "format": "uuid" }, "userId": { "type": "string", "format": "uuid" }, "phone": { "type": "string", "nullable": true } } },
      "CustomerProfileWithUser": { "allOf": [{ "$ref": "#/components/schemas/CustomerProfile" }, { "type": "object", "required": ["user"], "properties": { "user": { "$ref": "#/components/schemas/User" } } }] },
