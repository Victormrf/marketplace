      "Unauthorized": { "description": "Sessão ausente/inválida; { message: string }", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Message" }, "example": { "message": "Invalid credentials" } } } },
      "Forbidden": { "description": "Role ou ownership sem permissão; { error: string } ou { message: string } conforme middleware/controller", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorBody" } } } },
      "NotFound": { "description": "Recurso ausente ou fora do ownership quando o endpoint oculta sua existência", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorBody" } } } },
      "Conflict": { "description": "Conflito de estado, unicidade, estoque ou concorrência", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorBody" } } } },
      "InternalError": { "description": "Falha não classificada; pode ser { message: string } ou { error: string }", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorBody" } } } },
      "NoContent": { "description": "Operação concluída sem corpo" }
    },
