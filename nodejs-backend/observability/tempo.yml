auth_enabled: false
stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 1h
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
overrides:
  defaults:
    ingestion:
      rate_strategy: local
      rate_limit_bytes: 1000000
      burst_size_bytes: 2000000
    global:
      max_bytes_per_trace: 100000
usage_report:
  reporting_enabled: false
