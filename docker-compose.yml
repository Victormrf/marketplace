services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace_dev}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - marketplace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  marketplace_postgres_data:
