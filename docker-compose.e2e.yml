services:
  postgres-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: marketplace_e2e
      POSTGRES_USER: marketplace_e2e
      POSTGRES_PASSWORD: e2e_local_only
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace_e2e -d marketplace_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
